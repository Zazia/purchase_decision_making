<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>帕累托决策 - Product Tour</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=block" rel="stylesheet">
    <style>
      @font-face { font-family: 'Noto Sans SC'; src: local('Noto Sans SC'), local('Noto Sans CJK SC'); }
      @font-face { font-family: 'Microsoft YaHei'; src: local('Microsoft YaHei'); }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F5F5F7;
        font-family: "Inter", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }
      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .caption-text-wrapper {
        position: absolute;
        bottom: 80px;
        left: 0;
        right: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        overflow: hidden;
        padding: 10px 0;
      }
      .caption-line {
        grid-area: 1 / 1;
        color: #1D1D1F;
        font-size: 44px;
        font-weight: 600;
        letter-spacing: -0.01em;
        text-align: center;
        background: rgba(255, 255, 255, 0.8);
        padding: 14px 36px;
        border-radius: 100px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 4px 20px rgba(29, 29, 31, 0.08);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-j7pz" id="root" data-composition-id="main" data-start="0" data-duration="48" data-width="1920" data-height="1080">
    <!-- Scene 1: Logo Intro (0-2s) -->
    <div data-hf-id="hf-b5q3" id="scene-1" class="scene" data-composition-id="scene1-logo-intro" data-composition-src="compositions/scene1-logo-intro.html" data-start="0" data-duration="2" data-track-index="1" data-width="1920" data-height="1080"></div>

    <!-- Scene 1.5: Pareto Concept Intro (2-17s) -->
    <div data-hf-id="hf-pcs1" id="scene-1-5" class="scene" data-composition-id="scene1-5-pareto-concept" data-composition-src="compositions/scene1-5-pareto-concept.html" data-start="2" data-duration="15" data-track-index="1" data-width="1920" data-height="1080"></div>

    <!-- Scene 2: Product Tour Basic (17-24s) -->
    <div data-hf-id="hf-a2fz" id="scene-2" class="scene" data-composition-id="scene2-5-product-tour" data-composition-src="compositions/scene2-5-product-tour.html" data-start="17" data-duration="7" data-track-index="1" data-width="1920" data-height="1080"></div>

    <!-- Scene 3: Features Deep Dive (24-40s) -->
    <div data-hf-id="hf-pk3y" id="scene-3" class="scene" data-composition-id="scene3-features" data-composition-src="compositions/scene3-features.html" data-start="24" data-duration="16" data-track-index="1" data-width="1920" data-height="1080"></div>

    <!-- Scene 4: Share Card (40-43s) -->
    <div data-hf-id="hf-2e23" id="scene-4" class="scene" data-composition-id="scene4-sharecard" data-composition-src="compositions/scene4-sharecard.html" data-start="40" data-duration="3" data-track-index="1" data-width="1920" data-height="1080"></div>

    <!-- Scene 5: Logo Outro (43-48s) -->
    <div data-hf-id="hf-fl1h" id="scene-5" class="scene" data-composition-id="scene6-logo-outro" data-composition-src="compositions/scene6-logo-outro.html" data-start="43" data-duration="5" data-track-index="1" data-width="1920" data-height="1080"></div>

    <!-- Captions (2-43s) -->
    <div data-hf-id="hf-jrra" id="captions-comp" data-composition-id="captions" data-start="2" data-duration="41" data-track-index="2" data-width="1920" data-height="1080">
        <div data-hf-id="hf-yd6g" class="caption-text-wrapper">
          <div data-hf-id="hf-sxow" class="caption-line c-01">最好又最便宜的手机？并不存在</div>
          <div data-hf-id="hf-cap2" class="caption-line c-02">1906年，经济学家帕累托给出了答案</div>
          <div data-hf-id="hf-cap3" class="caption-line c-03">在价格与性能的坐标系里，存在一系列「前沿解」</div>
          <div data-hf-id="hf-cap4" class="caption-line c-04">没有「更省且更强」的替代，彼此没有绝对优劣</div>
          <div data-hf-id="hf-cap5" class="caption-line c-05">我们把这套框架，用在苹果产品的价格分析上</div>
          <div data-hf-id="hf-cap6" class="caption-line c-06">这就是「帕累托买苹果」</div>
          <div data-hf-id="hf-cap7" class="caption-line c-07">选择品类，设定预算</div>
          <div data-hf-id="hf-cap8" class="caption-line c-08">帕累托前沿分析，最优方案一目了然</div>
          <div data-hf-id="hf-cap10" class="caption-line c-10">帕累托前沿图：成本与性能的最优平衡</div>
          <div data-hf-id="hf-cap11" class="caption-line c-11">点击图表上的点或方案卡片，进入详情</div>
          <div data-hf-id="hf-cap9" class="caption-line c-09">价格和你看到的不符？</div>
          <div data-hf-id="hf-cap12" class="caption-line c-12">点击进入手动修改 — 你的购买调研笔记本</div>
          <div data-hf-id="hf-cap13" class="caption-line c-13">条件筛选，一键重算，即时更新推荐</div>
          <div data-hf-id="hf-cap14" class="caption-line c-14">一键分享，决策留存</div>
        </div>

        <script>
          (function () {
            const tl = gsap.timeline({ paused: true });

            function cap(cls, tIn, tOut, dIn = 0.5, dOut = 0.3) {
              const el = document.querySelector(cls);
              tl.fromTo(el,
                { opacity: 0, y: 30 },
                { opacity: 1, y: 0, duration: dIn, ease: "power3.out" },
                tIn
              );
              tl.to(el, { opacity: 0, y: -20, duration: dOut, ease: "power3.in" }, tOut);
            }

            // ===== Scene 1.5: Pareto concept intro (internal 0-15s) =====
            cap(".c-01", 0.3, 2.2);   // The wish
            cap(".c-02", 2.7, 4.75);  // Pareto 1906
            cap(".c-03", 5.2, 7.35);  // Frontier solutions
            cap(".c-04", 7.7, 10.15); // No absolute winner
            cap(".c-05", 10.5, 12.55);// Apply to Apple
            cap(".c-06", 12.9, 14.3); // The app

            // ===== Scene 2: Product tour (internal 15-22s) =====
            cap(".c-07", 15.2, 17.3); // 选择品类
            cap(".c-08", 17.6, 20.8); // 帕累托前沿

            // ===== Scene 3: Features deep dive (internal 22-38s) =====
            cap(".c-10", 22.0, 25.0); // 帕累托图解释
            cap(".c-11", 25.3, 28.0); // 交互探索
            cap(".c-09", 28.2, 30.4); // 详情页价格
            cap(".c-12", 30.6, 32.9); // 手动修改
            cap(".c-13", 33.8, 36.3); // 筛选与重算

            // ===== Scene 4: Share card (internal 38-41s) =====
            cap(".c-14", 38.2, 40.6, 0.5, 0.4); // 一键分享

            window.__timelines = window.__timelines || {};
            window.__timelines["captions"] = tl;
          })();
        </script>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const mainTl = gsap.timeline({ paused: true });

      // Scene 1.5 starts clean
      mainTl.set("#scene-1-5", { scale: 1, filter: "blur(0px)", opacity: 1 }, 2);

      // Transition: Scene 1.5 → Scene 2 (blur + scale)
      mainTl.to(
        "#scene-1-5",
        { duration: 0.3, scale: 0.96, filter: "blur(8px)", opacity: 0, ease: "power2.in" },
        16.7,
      );

      // Scene 2 starts clean
      mainTl.set("#scene-2", { scale: 1, filter: "blur(0px)", opacity: 1 }, 17);

      // Transition: Scene 2 → Scene 3 (blur + scale)
      mainTl.to(
        "#scene-2",
        { duration: 0.3, scale: 0.96, filter: "blur(8px)", opacity: 0, ease: "power2.in" },
        23.7,
      );

      // Scene 3 starts clean
      mainTl.set("#scene-3", { scale: 1, filter: "blur(0px)", opacity: 1 }, 24);

      // Transition: Scene 3 → Scene 4 (blur + scale)
      mainTl.to(
        "#scene-3",
        { duration: 0.3, scale: 0.96, filter: "blur(8px)", opacity: 0, ease: "power2.in" },
        39.7,
      );

      // Scene 4 starts clean
      mainTl.set("#scene-4", { scale: 1, filter: "blur(0px)", opacity: 1 }, 40);

      // Transition: Scene 4 → Scene 5 (blur + scale)
      mainTl.to(
        "#scene-4",
        { duration: 0.3, scale: 0.96, filter: "blur(8px)", opacity: 0, ease: "power2.in" },
        42.7,
      );

      window.__timelines["main"] = mainTl;
    </script>
  </body>
</html>
