        <script>
          (function () {
            const tl = gsap.timeline({ paused: true });

            function cap(cls, tIn, tOut, dIn = 0.5, dOut = 0.3) {
              const el = document.querySelector(cls);
              tl.fromTo(el,
                { opacity: 0, y: 30 },
                { opacity: 1, y: 0, duration: dIn, ease: "power3.out" },
                tIn
              );
              tl.to(el, { opacity: 0, y: -20, duration: dOut, ease: "power3.in" }, tOut);
            }

            // ===== Scene 1.5: Pareto concept intro (internal 0-23.5s) =====
            cap(".c-01", 0.15, 4.07);   // The wish（问句 + 肯定收）
            cap(".c-02", 4.57, 7.89);   // Pareto 1906
            cap(".c-03", 8.39, 12.02);  // Frontier solutions
            cap(".c-04", 12.52, 16.13); // No absolute winner
            cap(".c-05", 16.63, 20.08); // Apply to Apple
            cap(".c-06", 20.58, 23.15); // The app

            // ===== Scene 2: Product tour (internal 23.5-30.79s) =====
            cap(".c-07", 23.65, 26.23); // 选择品类
            cap(".c-08", 26.73, 30.44); // 帕累托前沿

            cap(".c-11", 35.34, 39.36); // 交互探索
            cap(".c-09", 39.86, 41.77); // 详情页价格
            cap(".c-12", 42.27, 45.90); // 手动修改
            cap(".c-13", 46.40, 50.39); // 筛选与重算

            // ===== Scene 4: Share card (internal 50.74-54.48s) =====
            cap(".c-14", 50.89, 54.33, 0.5, 0.4); // 一键分享

            window.__timelines = window.__timelines || {};
            window.__timelines["captions"] = tl;
          })();
        </script>
