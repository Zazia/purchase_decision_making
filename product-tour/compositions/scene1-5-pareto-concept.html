    <script>
      (function () {

        const sel = (s) => `[data-composition-id="scene1-5-pareto-concept"] ${s}`;

        gsap.set(sel(".bg-glow"), { opacity: 0 });
        gsap.set([sel(".ghost-text"), sel(".ghost-text-2")], { opacity: 0 });
        gsap.set(sel(".chart-card"), { y: 40, opacity: 0, scale: 0.98 });

        gsap.set(sel(".axis-y"), { strokeDasharray: 450, strokeDashoffset: 450 });

        gsap.set([sel(".axis-x-label"), sel(".axis-y-label")], { opacity: 0 });
        gsap.set(sel(".zone"), { opacity: 0, scale: 0.7 });
        gsap.set(sel(".zone-label-alt"), { opacity: 0 });
        gsap.set(sel(".wish-card-l"), { opacity: 0, x: -90, y: 40 });
        gsap.set(sel(".wish-card-r"), { opacity: 0, x: 90, y: 40 });
        gsap.set(sel(".wish-x"), { opacity: 0, scale: 0.3 });

        gsap.set(sel(".d-dots circle"), { scale: 0, opacity: 0 });
        gsap.set(sel(".f-dots circle"), { scale: 0, opacity: 0 });
        gsap.set(sel(".fseg"), { opacity: 0 });
        gsap.set(sel(".f-label"), { opacity: 0 });

        gsap.set([sel(".end-cheap"), sel(".end-strong")], { opacity: 0 });
        gsap.set(sel(".dom-arrow"), { opacity: 0 });
        gsap.set(sel(".phase"), { x: 60, opacity: 0 });
        gsap.set(sel(".app-pill"), { scale: 0.85, opacity: 0 });

        // === Phase 0: The wish caption over clean background (0-2.5s) ===
        tl.to(sel(".bg-glow"), { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.1);
        tl.to(sel(".ghost-text"), { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.15);

        // Wish cards converge, then the stamp lands on "并不存在"
        tl.to(sel(".intro-wish"), { opacity: 1, duration: 0.01 }, 0.3);
        tl.to(sel(".wish-card-l"), {
          x: 0, y: 0, opacity: 1,

          opacity: 1, scale: 1,

        tl.to([sel(".wish-card-l"), sel(".wish-card-r")], {

        // === Phase 1: Chart enters after the wish caption (2.5-4.7s) ===

        tl.to([sel(".grid"), sel(".ticks")], { opacity: 1, duration: 0.4, ease: "power2.out" }, 3.2);
        tl.to([sel(".axis-x-label"), sel(".axis-y-label")], { opacity: 1, duration: 0.4, ease: "power2.out" }, 3.3);

        tl.to(sel(".p1"), { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 2.9);

        tl.to(sel(".zone"), {

        tl.to(sel(".p2"), { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 4.75);
        tl.to(sel(".ghost-text-2"), { opacity: 1, duration: 0.6, ease: "power2.out" }, 4.9);

        tl.to(sel(".d-dots circle"), {
          scale: 1, opacity: 0.55,
          duration: 0.35, ease: "back.out(1.7)", stagger: 0.07,
        }, 4.9);

        tl.to(sel(".zone"), { opacity: 0.3, duration: 0.4, ease: "power2.inOut" }, 5.8);

        // === Phase 3: Frontier reveal (5.3-10.4s) ===
        tl.to(sel(".f-dots circle"), {
          scale: 1, opacity: 1,
          duration: 0.4, ease: "back.out(2)", stagger: 0.09,
        }, 5.3);

        tl.to(sel(".fseg"), { opacity: 1, duration: 0.15, stagger: 0.12 }, 6.3);
        tl.to(sel(".f-label"), { opacity: 1, duration: 0.3, ease: "power2.out" }, 7.0);
        tl.to(sel(".legend"), { opacity: 1, duration: 0.3, ease: "power2.out" }, 7.1);
        tl.to(sel(".d-dots circle"), { opacity: 0.32, duration: 0.35, ease: "power2.inOut" }, 7.3);

        tl.to(sel(".p2"), { x: -30, opacity: 0, duration: 0.3, ease: "power2.in" }, 7.5);
        tl.to(sel(".p3"), { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 7.65);

        // Zone punchline: does not exist
        tl.to(sel(".zone-label"), { opacity: 0, duration: 0.15, ease: "power1.in" }, 7.6);
        tl.to(sel(".zone-label-alt"), { opacity: 1, duration: 0.3, ease: "power2.out" }, 7.6);
        tl.to(sel(".zone"), { opacity: 0.55, duration: 0.3, ease: "power2.out" }, 7.6);
        tl.to(sel(".zone-ring"), { attr: { stroke: "#B25000" }, duration: 0.3 }, 7.6);

        // Dominance arrow
        tl.to(sel(".dom-arrow"), { opacity: 1, duration: 0.45, ease: "power2.out" }, 7.85);
        tl.to([sel(".end-cheap"), sel(".end-strong")], { opacity: 1, duration: 0.35, ease: "power2.out" }, 8.1);

        // Pulse on strongest frontier point
        tl.fromTo(sel(".pulse"),
          { attr: { r: 12 }, opacity: 0.9 },
          { attr: { r: 38 }, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false },
          9.2
        );
        tl.fromTo(sel(".pulse"),
          { attr: { r: 12 }, opacity: 0.9 },
          { attr: { r: 38 }, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false },
          9.8
        );

        // === Phase 4: Apply to Apple (10.4-15s) ===
        tl.to(sel(".p3"), { x: -30, opacity: 0, duration: 0.3, ease: "power2.in" }, 10.35);
        tl.to(sel(".p4"), { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 10.5);

        tl.to(sel(".app-pill"), {
          scale: 1, opacity: 1,
          duration: 0.5, ease: "back.out(1.5)",
        }, 11.0);

        tl.to(sel(".app-pill"), {
          y: -6, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1,
        }, 12.9);

        // === Exit wipe ===
        tl.to([
          sel(".chart-card"),
          sel(".panel"),
        ], {
          x: -2200, duration: 0.45, ease: "expo.in", stagger: 0.03,
        }, 14.4);
        tl.to([sel(".ghost-text"), sel(".ghost-text-2"), sel(".bg-glow")], {
          opacity: 0, duration: 0.3, ease: "power2.in",
        }, 14.4);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene1-5-pareto-concept"] = tl;
      })();
