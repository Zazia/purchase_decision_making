<template id="scene1-logo-intro-template">
  <div
    data-composition-id="scene1-logo-intro"
    data-width="1920"
    data-height="1080"
    data-duration="2"
  >
    <div class="canvas">
      <!-- Background decoratives -->
      <div class="bg-glow" data-layout-allow-overflow></div>
      <div class="ghost-text" data-layout-ignore>PARETO</div>

      <!-- Logo SVG (inline for GSAP animation) -->
      <div class="logo-container">
        <svg class="logo-svg" viewBox="-8 -8 116 116" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo">
          <defs>
            <linearGradient id="intro-grad-blue" x1="15" y1="5" x2="85" y2="95" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#5AC8FA"/>
              <stop offset="50%" stop-color="#2B8CF7"/>
              <stop offset="100%" stop-color="#007AFF"/>
            </linearGradient>
            <linearGradient id="intro-grad-hl" x1="4.96" y1="100" x2="103.93" y2="4.04" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.87"/>
              <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.47"/>
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
            </linearGradient>
            <clipPath id="intro-clip-sq">
              <rect x="0" y="0" width="100" height="100" rx="22" ry="22"/>
            </clipPath>
            <filter id="intro-shadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1D1D1F" flood-opacity="0.12"/>
            </filter>
          </defs>

          <g id="intro-squircle">
            <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="#FFFFFF" filter="url(#intro-shadow)"/>
          </g>
          <g id="intro-logo-content" clip-path="url(#intro-clip-sq)">
            <g id="intro-curve">
              <path id="intro-curve-fill"
                    d="M70,0 H100 V100 H0 V70 C0,51.4348 7.37498,33.6301 20.5025,20.5025 C33.6301,7.375 51.4348,0 70,0 Z"
                    fill="url(#intro-grad-blue)"/>
              <path id="intro-curve-highlight"
                    d="M100,0 H71.2 C53.3775,0 36.2849,7.375 23.6824,20.5025 C11.08,33.6301 4,51.4348 4,70 V100"
                    fill="none" stroke="url(#intro-grad-hl)" stroke-width="8" stroke-linecap="round"/>
            </g>
            <g id="intro-dots" fill="#FFFFFF">
              <circle id="intro-dot-01" cx="87"   cy="20"   r="3"/>
              <circle id="intro-dot-02" cx="29"   cy="31"   r="3"/>
              <circle id="intro-dot-03" cx="26.5" cy="43.5" r="5.5"/>
              <circle id="intro-dot-04" cx="84"   cy="45"   r="4"   opacity="0.8"/>
              <circle id="intro-dot-05" cx="69.5" cy="29.5" r="6.5" opacity="0.85"/>
              <circle id="intro-dot-06" cx="39.5" cy="61.5" r="4.5" opacity="0.9"/>
              <circle id="intro-dot-07" cx="60"   cy="54"   r="5"   opacity="0.85"/>
              <circle id="intro-dot-08" cx="49"   cy="33"   r="5"   opacity="0.9"/>
              <circle id="intro-dot-09" cx="44"   cy="80"   r="4"   opacity="0.6"/>
              <circle id="intro-dot-10" cx="20.5" cy="66.5" r="3.5"/>
              <circle id="intro-dot-11" cx="81"   cy="60"   r="3"   opacity="0.6"/>
              <circle id="intro-dot-12" cx="51"   cy="16"   r="5"/>
            </g>
          </g>
        </svg>
      </div>

      <!-- Expanding Ring -->
      <div class="ring-container">
        <svg viewBox="0 0 400 400" width="400" height="400">
          <circle
            class="ring"
            cx="200"
            cy="200"
            r="80"
            fill="none"
            stroke="#007AFF"
            stroke-width="3"
          />
        </svg>
      </div>

      <!-- App name flash -->
      <div class="app-name-flash">帕累托决策</div>
    </div>

    <style>
      @font-face { font-family: 'Noto Sans SC'; src: local('Noto Sans SC'), local('Noto Sans CJK SC'); }
      @font-face { font-family: 'Microsoft YaHei'; src: local('Microsoft YaHei'); }
      [data-composition-id="scene1-logo-intro"] .canvas {
        width: 1920px;
        height: 1080px;
        background-color: #F5F5F7;
        position: relative;
        overflow: hidden;
        font-family: "Inter", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      [data-composition-id="scene1-logo-intro"] .bg-glow {
        position: absolute;
        left: 710px;
        top: 290px;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(0, 122, 255, 0.10) 0%, rgba(245, 245, 247, 0) 70%);
        border-radius: 50%;
      }

      [data-composition-id="scene1-logo-intro"] .ghost-text {
        position: absolute;
        top: 380px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 260px;
        font-weight: 800;
        color: rgba(0, 122, 255, 0.04);
        letter-spacing: -0.04em;
        pointer-events: none;
        white-space: nowrap;
      }

      [data-composition-id="scene1-logo-intro"] .logo-container {
        position: absolute;
        left: 850px;
        top: 430px;
        width: 220px;
        height: 220px;
        transform-origin: center center;
      }

      [data-composition-id="scene1-logo-intro"] .logo-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      [data-composition-id="scene1-logo-intro"] .logo-svg #intro-squircle,
      [data-composition-id="scene1-logo-intro"] .logo-svg #intro-curve,
      [data-composition-id="scene1-logo-intro"] .logo-svg #intro-dots circle {
        transform-box: fill-box;
        transform-origin: center;
      }

      [data-composition-id="scene1-logo-intro"] .ring-container {
        position: absolute;
        left: 750px;
        top: 330px;
        width: 420px;
        height: 420px;
        pointer-events: none;
      }

      [data-composition-id="scene1-logo-intro"] .ring {
        transform-origin: center center;
        opacity: 0;
      }

      [data-composition-id="scene1-logo-intro"] .app-name-flash {
        position: absolute;
        top: 680px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 36px;
        font-weight: 600;
        color: #1D1D1F;
        letter-spacing: 0.08em;
        opacity: 0;
        white-space: nowrap;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const sel = (s) => `[data-composition-id="scene1-logo-intro"] ${s}`;

        const dotOps = [1, 1, 1, 0.8, 0.85, 0.9, 0.85, 0.9, 0.6, 1, 0.6, 1];

        // Initial states — use gsap.set (immediate, not timeline-bound)
        gsap.set(sel("#intro-squircle"), { scale: 0.85, opacity: 0 });
        gsap.set(sel("#intro-curve"), { scale: 0.92, opacity: 0 });
        gsap.set(sel("#intro-dots circle"), { scale: 0, opacity: 0 });
        gsap.set(sel(".ring"), { scale: 0.3, opacity: 0 });
        gsap.set(sel(".app-name-flash"), { opacity: 0 });
        gsap.set(sel(".ghost-text"), { opacity: 0 });

        // 1. Squircle scales in (0.0 - 0.35s)
        tl.to(sel("#intro-squircle"), {
          scale: 1, opacity: 1,
          duration: 0.35,
          ease: "power3.out"
        }, 0);

        // 2. Ring expands on impact (0.25s)
        tl.fromTo(sel(".ring"),
          { scale: 0.3, opacity: 0.8 },
          { scale: 2.2, opacity: 0, duration: 0.5, ease: "power2.out" },
          0.25
        );

        // 3. Blue curve fades in (0.2 - 0.55s)
        tl.to(sel("#intro-curve"), {
          scale: 1, opacity: 1,
          duration: 0.35,
          ease: "power2.out"
        }, 0.2);

        // 4. Dots pop in one by one with stagger (0.35 - 1.15s)
        tl.to(sel("#intro-dots circle"), {
          scale: 1.15,
          opacity: function(i) { return dotOps[i]; },
          duration: 0.25,
          ease: "back.out(2)",
          stagger: 0.055
        }, 0.35);

        // Settle dots to final scale
        tl.to(sel("#intro-dots circle"), {
          scale: 1,
          duration: 0.12,
          ease: "power2.inOut",
          stagger: 0.055
        }, 0.60);

        // 5. App name flashes (0.8 - 1.5s)
        tl.fromTo(sel(".app-name-flash"),
          { opacity: 0, y: 15 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
          0.8
        );

        // 6. Hold, then scale down for transition (1.5 - 2.0s)
        tl.to(sel(".app-name-flash"), {
          opacity: 0,
          duration: 0.2,
          ease: "power2.in"
        }, 1.5);

        tl.to(sel(".logo-container"), {
          scale: 0,
          opacity: 0,
          duration: 0.35,
          ease: "expo.in"
        }, 1.6);

        // Ghost text drift
        tl.to(sel(".ghost-text"), { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.3);
        tl.to(sel(".ghost-text"), { opacity: 0, duration: 0.3, ease: "power2.in" }, 1.4);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene1-logo-intro"] = tl;
      })();
    </script>
  </div>
</template>
