<template id="scene6-logo-outro-template">
  <div
    data-composition-id="scene6-logo-outro"
    data-width="1920"
    data-height="1080"
    data-duration="5"
  >
    <div class="canvas">
      <!-- Background -->
      <div class="bg-glow" data-layout-allow-overflow></div>
      <div class="ghost-text" data-layout-ignore>PARETO</div>

      <!-- Logo SVG (inline for GSAP animation) -->
      <div class="logo-container">
        <svg class="logo-svg" viewBox="-8 -8 116 116" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo">
          <defs>
            <linearGradient id="outro-grad-blue" x1="15" y1="5" x2="85" y2="95" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#5AC8FA"/>
              <stop offset="50%" stop-color="#2B8CF7"/>
              <stop offset="100%" stop-color="#007AFF"/>
            </linearGradient>
            <linearGradient id="outro-grad-hl" x1="4.96" y1="100" x2="103.93" y2="4.04" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.87"/>
              <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.47"/>
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
            </linearGradient>
            <clipPath id="outro-clip-sq">
              <rect x="0" y="0" width="100" height="100" rx="22" ry="22"/>
            </clipPath>
            <filter id="outro-shadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1D1D1F" flood-opacity="0.12"/>
            </filter>
          </defs>

          <g id="outro-squircle">
            <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="#FFFFFF" filter="url(#outro-shadow)"/>
          </g>
          <g id="outro-logo-content" clip-path="url(#outro-clip-sq)">
            <g id="outro-curve">
              <path id="outro-curve-fill"
                    d="M70,0 H100 V100 H0 V70 C0,51.4348 7.37498,33.6301 20.5025,20.5025 C33.6301,7.375 51.4348,0 70,0 Z"
                    fill="url(#outro-grad-blue)"/>
              <path id="outro-curve-highlight"
                    d="M100,0 H71.2 C53.3775,0 36.2849,7.375 23.6824,20.5025 C11.08,33.6301 4,51.4348 4,70 V100"
                    fill="none" stroke="url(#outro-grad-hl)" stroke-width="8" stroke-linecap="round"/>
            </g>
            <g id="outro-dots" fill="#FFFFFF">
              <circle id="outro-dot-01" cx="87"   cy="20"   r="3"/>
              <circle id="outro-dot-02" cx="29"   cy="31"   r="3"/>
              <circle id="outro-dot-03" cx="26.5" cy="43.5" r="5.5"/>
              <circle id="outro-dot-04" cx="84"   cy="45"   r="4"   opacity="0.8"/>
              <circle id="outro-dot-05" cx="69.5" cy="29.5" r="6.5" opacity="0.85"/>
              <circle id="outro-dot-06" cx="39.5" cy="61.5" r="4.5" opacity="0.9"/>
              <circle id="outro-dot-07" cx="60"   cy="54"   r="5"   opacity="0.85"/>
              <circle id="outro-dot-08" cx="49"   cy="33"   r="5"   opacity="0.9"/>
              <circle id="outro-dot-09" cx="44"   cy="80"   r="4"   opacity="0.6"/>
              <circle id="outro-dot-10" cx="20.5" cy="66.5" r="3.5"/>
              <circle id="outro-dot-11" cx="81"   cy="60"   r="3"   opacity="0.6"/>
              <circle id="outro-dot-12" cx="51"   cy="16"   r="5"/>
            </g>
          </g>
        </svg>
      </div>

      <!-- Tagline -->
      <div class="text-container">
        <div class="tagline">帕累托决策</div>
        <div class="subtitle">数据驱动的理性消费工具</div>
        <div class="url-pill">
          <div class="url-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M9 2C9 1.45 9.45 1 10 1H14C14.55 1 15 1.45 15 2V3H9V2Z" fill="#007AFF"/>
              <path d="M16 3H8C5.79 3 4 4.79 4 7V19C4 21.21 5.79 23 8 23H16C18.21 23 20 21.21 20 19V7C20 4.79 18.21 3 16 3ZM12 20C9.24 20 7 17.76 7 15C7 12.24 9.24 10 12 10C14.76 10 17 12.24 17 15C17 17.76 14.76 20 12 20Z" fill="#86868B"/>
            </svg>
          </div>
          <span class="url-text">微信小程序</span>
        </div>
      </div>
    </div>

    <style>
      @font-face { font-family: 'Noto Sans SC'; src: local('Noto Sans SC'), local('Noto Sans CJK SC'); }
      @font-face { font-family: 'Microsoft YaHei'; src: local('Microsoft YaHei'); }
      [data-composition-id="scene6-logo-outro"] .canvas {
        width: 1920px;
        height: 1080px;
        background: #F5F5F7;
        position: relative;
        overflow: hidden;
        font-family: "Inter", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      [data-composition-id="scene6-logo-outro"] .bg-glow {
        position: absolute;
        left: 660px;
        top: 140px;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(0, 122, 255, 0.08) 0%, rgba(245, 245, 247, 0) 70%);
        border-radius: 50%;
        opacity: 0;
      }

      [data-composition-id="scene6-logo-outro"] .ghost-text {
        position: absolute;
        top: 400px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 260px;
        font-weight: 800;
        color: rgba(0, 122, 255, 0.03);
        letter-spacing: -0.04em;
        pointer-events: none;
        white-space: nowrap;
      }

      [data-composition-id="scene6-logo-outro"] .logo-container {
        position: absolute;
        left: 850px;
        top: 330px;
        width: 220px;
        height: 220px;
        z-index: 2;
      }

      [data-composition-id="scene6-logo-outro"] .logo-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      [data-composition-id="scene6-logo-outro"] .logo-svg #outro-squircle,
      [data-composition-id="scene6-logo-outro"] .logo-svg #outro-curve,
      [data-composition-id="scene6-logo-outro"] .logo-svg #outro-dots circle {
        transform-box: fill-box;
        transform-origin: center;
      }

      [data-composition-id="scene6-logo-outro"] .text-container {
        position: absolute;
        top: 640px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 3;
      }

      [data-composition-id="scene6-logo-outro"] .tagline {
        font-size: 52px;
        font-weight: 700;
        color: #1D1D1F;
        opacity: 0;
        margin-bottom: 16px;
        text-align: center;
        letter-spacing: 0.02em;
      }

      [data-composition-id="scene6-logo-outro"] .subtitle {
        font-size: 28px;
        font-weight: 400;
        color: #86868B;
        opacity: 0;
        margin-bottom: 40px;
        text-align: center;
      }

      [data-composition-id="scene6-logo-outro"] .url-pill {
        background: #FFFFFF;
        border: 1px solid #D2D2D7;
        border-radius: 100px;
        padding: 12px 28px;
        opacity: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 12px rgba(29, 29, 31, 0.06);
      }

      [data-composition-id="scene6-logo-outro"] .url-icon {
        display: flex;
        align-items: center;
      }

      [data-composition-id="scene6-logo-outro"] .url-text {
        font-size: 20px;
        color: #86868B;
        letter-spacing: 0.3px;
        font-weight: 500;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const sel = (s) => `[data-composition-id="scene6-logo-outro"] ${s}`;

        const dotOps = [1, 1, 1, 0.8, 0.85, 0.9, 0.85, 0.9, 0.6, 1, 0.6, 1];

        // Initial states — use gsap.set (immediate, not timeline-bound)
        gsap.set(sel("#outro-squircle"), { scale: 0.88, opacity: 0 });
        gsap.set(sel("#outro-curve"), { scale: 0.92, opacity: 0 });
        gsap.set(sel("#outro-curve-highlight"), { opacity: 0 });
        gsap.set(sel("#outro-dots circle"), { scale: 0, opacity: 0 });
        gsap.set(sel(".bg-glow"), { opacity: 0, scale: 0.5 });
        gsap.set(sel(".tagline"), { opacity: 0, y: 25 });
        gsap.set(sel(".subtitle"), { opacity: 0, y: 15 });
        gsap.set(sel(".url-pill"), { opacity: 0, y: 12, scale: 0.9 });
        gsap.set(sel(".ghost-text"), { opacity: 0 });

        // 1. Squircle fades in (0.0 - 0.5s)
        tl.to(sel("#outro-squircle"), {
          scale: 1, opacity: 1,
          duration: 0.5,
          ease: "power3.out"
        }, 0);

        // 2. Blue curve fades in (0.2 - 0.6s)
        tl.to(sel("#outro-curve"), {
          scale: 1, opacity: 1,
          duration: 0.4,
          ease: "power2.out"
        }, 0.2);

        // Curve highlight glow
        tl.to(sel("#outro-curve-highlight"), {
          opacity: 1,
          duration: 0.4,
          ease: "power2.out"
        }, 0.4);

        // 3. Dots pop in one by one with stagger (0.4 - 1.4s)
        tl.to(sel("#outro-dots circle"), {
          scale: 1.15,
          opacity: function(i) { return dotOps[i]; },
          duration: 0.3,
          ease: "back.out(2)",
          stagger: 0.06
        }, 0.4);

        // Settle dots
        tl.to(sel("#outro-dots circle"), {
          scale: 1,
          duration: 0.15,
          ease: "power2.inOut",
          stagger: 0.06
        }, 0.70);

        // 4. Glow blooms (0.5s)
        tl.to(sel(".bg-glow"), {
          opacity: 1, scale: 1.2, duration: 0.5, ease: "power2.out"
        }, 0.5);
        tl.to(sel(".bg-glow"), {
          opacity: 0.6, scale: 1.5, duration: 1.0, ease: "power2.out"
        }, 0.9);

        // 5. Tagline rises (1.1 - 1.8s)
        tl.to(sel(".tagline"), {
          opacity: 1, y: 0, duration: 0.7, ease: "power3.out"
        }, 1.1);

        // 6. Subtitle fades in (1.5 - 2.1s)
        tl.to(sel(".subtitle"), {
          opacity: 1, y: 0, duration: 0.6, ease: "power3.out"
        }, 1.5);

        // 7. URL pill appears (1.9 - 2.4s)
        tl.to(sel(".url-pill"), {
          opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.4)"
        }, 1.9);

        // 8. Ghost text fades in slowly
        tl.to(sel(".ghost-text"), { opacity: 1, duration: 1.5, ease: "power2.out" }, 0.5);

        // 9. Idle: dots gentle twinkle (2.5s onwards)
        tl.to(sel("#outro-dots circle"), {
          opacity: function(i) { return dotOps[i] * 0.7; },
          duration: 0.8,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 1,
          stagger: 0.1
        }, 2.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene6-logo-outro"] = tl;
      })();
    </script>
  </div>
</template>
