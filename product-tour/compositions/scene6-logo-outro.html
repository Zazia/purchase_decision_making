<template id="scene6-logo-outro-template">
  <div
    data-composition-id="scene6-logo-outro"
    data-width="1920"
    data-height="1080"
    data-duration="5"
  >
    <div class="canvas">
      <!-- Background -->
      <div class="bg-glow" data-layout-allow-overflow></div>
      <div class="ghost-text" data-layout-ignore>DECISION</div>

      <!-- Logo Container -->
      <div class="logo-container">
        <!-- 4 quadrant pieces -->
        <div class="logo-piece piece-tl"></div>
        <div class="logo-piece piece-tr"></div>
        <div class="logo-piece piece-bl"></div>
        <div class="logo-piece piece-br"></div>

        <!-- Pareto curve -->
        <svg class="pareto-curve" viewBox="0 0 200 200" width="200" height="200">
          <path
            d="M 50 150 L 50 120 L 90 120 L 90 90 L 130 90 L 130 60 L 160 60"
            stroke="white"
            stroke-width="7"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="50" cy="120" r="5" fill="white" />
          <circle cx="90" cy="90" r="5" fill="white" />
          <circle cx="130" cy="60" r="5" fill="white" />
        </svg>
      </div>

      <!-- Tagline -->
      <div class="text-container">
        <div class="tagline">苹果购买决策分析</div>
        <div class="subtitle">数据驱动的理性消费工具</div>
        <div class="url-pill">
          <div class="url-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M9 2C9 1.45 9.45 1 10 1H14C14.55 1 15 1.45 15 2V3H9V2Z" fill="#007AFF"/>
              <path d="M16 3H8C5.79 3 4 4.79 4 7V19C4 21.21 5.79 23 8 23H16C18.21 23 20 21.21 20 19V7C20 4.79 18.21 3 16 3ZM12 20C9.24 20 7 17.76 7 15C7 12.24 9.24 10 12 10C14.76 10 17 12.24 17 15C17 17.76 14.76 20 12 20Z" fill="#86868B"/>
            </svg>
          </div>
          <span class="url-text">微信小程序</span>
        </div>
      </div>
    </div>

    <style>
      @font-face { font-family: 'Noto Sans SC'; src: local('Noto Sans SC'), local('Noto Sans CJK SC'); }
      @font-face { font-family: 'Microsoft YaHei'; src: local('Microsoft YaHei'); }
      [data-composition-id="scene6-logo-outro"] .canvas {
        width: 1920px;
        height: 1080px;
        background: #F5F5F7;
        position: relative;
        overflow: hidden;
        font-family: "Inter", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      [data-composition-id="scene6-logo-outro"] .bg-glow {
        position: absolute;
        left: 660px;
        top: 140px;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(0, 122, 255, 0.08) 0%, rgba(245, 245, 247, 0) 70%);
        border-radius: 50%;
        opacity: 0;
      }

      [data-composition-id="scene6-logo-outro"] .ghost-text {
        position: absolute;
        top: 400px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 280px;
        font-weight: 800;
        color: rgba(0, 122, 255, 0.03);
        letter-spacing: -0.04em;
        pointer-events: none;
        white-space: nowrap;
      }

      [data-composition-id="scene6-logo-outro"] .logo-container {
        position: absolute;
        left: 860px;
        top: 360px;
        width: 200px;
        height: 200px;
        z-index: 2;
      }

      [data-composition-id="scene6-logo-outro"] .logo-piece {
        position: absolute;
        width: 100px;
        height: 100px;
        transform-origin: center center;
        opacity: 0;
      }

      [data-composition-id="scene6-logo-outro"] .piece-tl {
        background: #007AFF;
        border-radius: 40px 0 0 0;
        top: 0; left: 0;
      }
      [data-composition-id="scene6-logo-outro"] .piece-tr {
        background: #4DA2FF;
        border-radius: 0 40px 0 0;
        top: 0; right: 0;
      }
      [data-composition-id="scene6-logo-outro"] .piece-bl {
        background: #0051D5;
        border-radius: 0 0 0 40px;
        bottom: 0; left: 0;
      }
      [data-composition-id="scene6-logo-outro"] .piece-br {
        background: #007AFF;
        border-radius: 0 0 40px 0;
        bottom: 0; right: 0;
      }

      [data-composition-id="scene6-logo-outro"] .pareto-curve {
        position: absolute;
        top: 0; left: 0;
        opacity: 0;
      }

      [data-composition-id="scene6-logo-outro"] .text-container {
        position: absolute;
        top: 660px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 3;
      }

      [data-composition-id="scene6-logo-outro"] .tagline {
        font-size: 52px;
        font-weight: 700;
        color: #1D1D1F;
        opacity: 0;
        margin-bottom: 16px;
        text-align: center;
        letter-spacing: -0.02em;
      }

      [data-composition-id="scene6-logo-outro"] .subtitle {
        font-size: 28px;
        font-weight: 400;
        color: #86868B;
        opacity: 0;
        margin-bottom: 40px;
        text-align: center;
      }

      [data-composition-id="scene6-logo-outro"] .url-pill {
        background: #FFFFFF;
        border: 1px solid #D2D2D7;
        border-radius: 100px;
        padding: 12px 28px;
        opacity: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 12px rgba(29, 29, 31, 0.06);
      }

      [data-composition-id="scene6-logo-outro"] .url-icon {
        display: flex;
        align-items: center;
      }

      [data-composition-id="scene6-logo-outro"] .url-text {
        font-size: 20px;
        color: #86868B;
        letter-spacing: 0.3px;
        font-weight: 500;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const sel = (s) => `[data-composition-id="scene6-logo-outro"] ${s}`;

        const pieces = [".piece-tl", ".piece-tr", ".piece-bl", ".piece-br"];
        const logoGlow = sel(".bg-glow");
        const paretoCurve = sel(".pareto-curve");
        const tagline = sel(".tagline");
        const subtitle = sel(".subtitle");
        const urlPill = sel(".url-pill");

        // 1. Pieces slide in from the right with stagger
        pieces.forEach((piece, i) => {
          tl.fromTo(
            sel(piece),
            { x: 1920, opacity: 0 },
            { x: 0, opacity: 1, duration: 1.0, ease: "power4.out" },
            0.1 + i * 0.08
          );
        });

        // 2. Pieces expand slightly then settle
        const expandTime = 1.0;
        tl.to(
          pieces.map(p => sel(p)),
          { scale: 1.12, duration: 0.4, ease: "back.out(1.7)", stagger: 0.02 },
          expandTime
        );
        tl.to(
          pieces.map(p => sel(p)),
          { scale: 1, duration: 0.35, ease: "power2.inOut" },
          expandTime + 0.3
        );

        // 3. Glow blooms
        tl.fromTo(
          logoGlow,
          { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1.2, duration: 0.4, ease: "power2.out" },
          expandTime
        );
        tl.to(logoGlow, {
          opacity: 0.6, scale: 1.5, duration: 1.0, ease: "power2.out",
        }, expandTime + 0.4);

        // 4. Pareto curve fades in
        tl.to(paretoCurve, { opacity: 1, duration: 0.4, ease: "power2.out" }, expandTime + 0.2);

        // 5. Tagline and subtitle fade in
        tl.fromTo(
          tagline,
          { opacity: 0, y: 25 },
          { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
          expandTime + 0.6
        );

        tl.fromTo(
          subtitle,
          { opacity: 0, y: 15 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
          expandTime + 1.0
        );

        // 6. URL pill appears
        tl.fromTo(
          urlPill,
          { opacity: 0, y: 12, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.4)" },
          expandTime + 1.4
        );

        // 7. Ghost text fades in slowly
        tl.fromTo(sel(".ghost-text"), { opacity: 0 }, { opacity: 1, duration: 1.5, ease: "power2.out" }, 0.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene6-logo-outro"] = tl;
      })();
    </script>
  </div>
</template>
