<template id="scene3-features-template">
  <div
    data-composition-id="scene3-features"
    data-width="1920"
    data-height="1080"
    data-duration="13"
  >
    <div class="canvas">
      <!-- Background -->
      <div class="bg-base"></div>
      <div class="bg-glow-left" data-layout-allow-overflow></div>
      <div class="bg-glow-right" data-layout-allow-overflow></div>
      <div class="ghost-text" data-layout-ignore>PARETO</div>
      <div class="ghost-text-2" data-layout-ignore>FRONTIER</div>

      <!-- Phone Mockup -->
      <div class="phone-wrapper">
        <div class="phone-mockup">
          <div class="phone-notch"></div>
          <div class="phone-screen">
            <img class="screenshot ss-pareto" src="assets/step-10-pareto-chart.png" alt="Pareto Chart" />
            <img class="screenshot ss-detail" src="assets/step-07-detail.png" alt="Detail" />
            <img class="screenshot ss-editor" src="assets/step-11-editor-main.png" alt="Editor" />
            <img class="screenshot ss-filter" src="assets/step-12-editor-filter.png" alt="Filter" />
            <img class="screenshot ss-recompute" src="assets/step-13-editor-recompute.png" alt="Recompute" />
          </div>
        </div>
        <div class="phone-shadow"></div>
      </div>

      <!-- Tap indicator -->
      <div class="tap-indicator" data-layout-allow-overflow>
        <div class="tap-ring"></div>
        <div class="tap-dot"></div>
      </div>

      <!-- Feature annotations (right side) -->
      <div class="annotation-panel">
        <!-- Phase 1: Pareto chart explanation -->
        <div class="anno-item anno-pareto">
          <div class="anno-number">04</div>
          <div class="anno-title">帕累托前沿图</div>
          <div class="anno-desc">横轴月均成本，纵轴性能满足度</div>
          <div class="anno-desc">前沿上的点不存在更优选择</div>
        </div>

        <!-- Phase 2: Tap to detail -->
        <div class="anno-item anno-tap-detail">
          <div class="anno-number">05</div>
          <div class="anno-title">交互式探索</div>
          <div class="anno-desc">点击图表上的点或方案卡片</div>
          <div class="anno-desc">即可进入方案详情页</div>
        </div>

        <!-- Phase 3: Manual modification -->
        <div class="anno-item anno-manual">
          <div class="anno-number">06</div>
          <div class="anno-title">手动修改方案</div>
          <div class="anno-desc">用户的购买调研笔记本</div>
          <div class="anno-desc">记录实际价格，调整方案</div>
        </div>

        <!-- Phase 4: Price adjustment -->
        <div class="anno-item anno-price">
          <div class="anno-icon-row">
            <div class="anno-icon-box">¥</div>
            <div class="anno-inline-title">调整买入价格</div>
          </div>
          <div class="anno-desc">直接修改价格，记录调研结果</div>
        </div>

        <!-- Phase 5: Filter -->
        <div class="anno-item anno-filter">
          <div class="anno-icon-row">
            <div class="anno-icon-box">⚙</div>
            <div class="anno-inline-title">条件筛选</div>
          </div>
          <div class="anno-desc">按型号、内存、存储等维度筛选</div>
        </div>

        <!-- Phase 6: Recompute -->
        <div class="anno-item anno-recompute">
          <div class="anno-icon-row">
            <div class="anno-icon-box">↻</div>
            <div class="anno-inline-title">重算报告</div>
          </div>
          <div class="anno-desc">一键重算，即时更新推荐结果</div>
        </div>
      </div>

      <!-- Highlight pulse for chart points -->
      <div class="pulse-ring" data-layout-allow-overflow></div>

      <!-- Connector line from annotation to phone -->
      <svg class="connector-svg" viewBox="0 0 1920 1080" width="1920" height="1080">
        <line class="conn-line conn-pareto" x1="970" y1="400" x2="1080" y2="400" stroke="#007AFF" stroke-width="2" stroke-dasharray="4 4" opacity="0" />
        <line class="conn-line conn-editor" x1="970" y1="500" x2="1080" y2="500" stroke="#007AFF" stroke-width="2" stroke-dasharray="4 4" opacity="0" />
      </svg>
    </div>

    <style>
      @font-face { font-family: 'Noto Sans SC'; src: local('Noto Sans SC'), local('Noto Sans CJK SC'); }
      @font-face { font-family: 'Microsoft YaHei'; src: local('Microsoft YaHei'); }
      [data-composition-id="scene3-features"] .canvas {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        font-family: "Inter", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      [data-composition-id="scene3-features"] .bg-base {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #F5F5F7;
      }

      [data-composition-id="scene3-features"] .bg-glow-left {
        position: absolute;
        top: 150px; left: -200px;
        width: 800px; height: 800px;
        background: radial-gradient(circle, rgba(0, 122, 255, 0.05) 0%, rgba(245, 245, 247, 0) 70%);
        border-radius: 50%;
      }

      [data-composition-id="scene3-features"] .bg-glow-right {
        position: absolute;
        top: 80px; right: -100px;
        width: 600px; height: 600px;
        background: radial-gradient(circle, rgba(0, 122, 255, 0.04) 0%, rgba(245, 245, 247, 0) 70%);
        border-radius: 50%;
      }

      [data-composition-id="scene3-features"] .ghost-text {
        position: absolute;
        top: 50px; left: -30px;
        font-size: 180px;
        font-weight: 800;
        color: rgba(0, 122, 255, 0.035);
        letter-spacing: -0.04em;
        pointer-events: none;
        white-space: nowrap;
      }

      [data-composition-id="scene3-features"] .ghost-text-2 {
        position: absolute;
        bottom: 30px; right: -10px;
        font-size: 180px;
        font-weight: 800;
        color: rgba(0, 122, 255, 0.03);
        letter-spacing: -0.04em;
        pointer-events: none;
        white-space: nowrap;
      }

      [data-composition-id="scene3-features"] .phone-wrapper {
        position: absolute;
        left: 420px;
        top: 70px;
        width: 400px;
        height: 940px;
        transform-origin: center center;
      }

      [data-composition-id="scene3-features"] .phone-mockup {
        position: relative;
        width: 100%;
        height: 100%;
        background: #1D1D1F;
        border-radius: 52px;
        padding: 10px;
        box-shadow: 0 40px 80px rgba(29, 29, 31, 0.12),
                    0 15px 35px rgba(29, 29, 31, 0.08),
                    inset 0 0 0 2px rgba(255,255,255,0.06);
        z-index: 5;
      }

      [data-composition-id="scene3-features"] .phone-notch {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 28px;
        background: #1D1D1F;
        border-radius: 0 0 18px 18px;
        z-index: 10;
      }

      [data-composition-id="scene3-features"] .phone-screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 44px;
        overflow: hidden;
        background: #FFFFFF;
      }

      [data-composition-id="scene3-features"] .screenshot {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
      }

      [data-composition-id="scene3-features"] .ss-pareto { opacity: 1; }

      [data-composition-id="scene3-features"] .phone-shadow {
        position: absolute;
        bottom: -30px;
        left: 50%;
        transform: translateX(-50%);
        width: 340px;
        height: 30px;
        background: radial-gradient(ellipse, rgba(29,29,31,0.15) 0%, rgba(245,245,247,0) 70%);
        border-radius: 50%;
      }

      [data-composition-id="scene3-features"] .tap-indicator {
        position: absolute;
        z-index: 20;
        pointer-events: none;
        opacity: 0;
      }

      [data-composition-id="scene3-features"] .tap-ring {
        position: absolute;
        width: 40px;
        height: 40px;
        border: 3px solid #007AFF;
        border-radius: 50%;
        top: -20px;
        left: -20px;
      }

      [data-composition-id="scene3-features"] .tap-dot {
        position: absolute;
        width: 12px;
        height: 12px;
        background: #007AFF;
        border-radius: 50%;
        top: -6px;
        left: -6px;
      }

      [data-composition-id="scene3-features"] .pulse-ring {
        position: absolute;
        z-index: 18;
        pointer-events: none;
        opacity: 0;
        width: 60px;
        height: 60px;
        border: 3px solid #34C759;
        border-radius: 50%;
        top: -30px;
        left: -30px;
      }

      [data-composition-id="scene3-features"] .annotation-panel {
        position: absolute;
        right: 80px;
        top: 120px;
        width: 460px;
        z-index: 15;
      }

      [data-composition-id="scene3-features"] .anno-item {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        opacity: 0;
      }

      [data-composition-id="scene3-features"] .anno-number {
        font-family: "JetBrains Mono", "Inter", monospace;
        font-size: 16px;
        font-weight: 600;
        color: #007AFF;
        margin-bottom: 6px;
        letter-spacing: 0.05em;
      }

      [data-composition-id="scene3-features"] .anno-title {
        font-size: 40px;
        font-weight: 700;
        color: #1D1D1F;
        margin-bottom: 12px;
        letter-spacing: -0.02em;
      }

      [data-composition-id="scene3-features"] .anno-desc {
        font-size: 22px;
        font-weight: 400;
        color: #86868B;
        line-height: 1.5;
      }

      [data-composition-id="scene3-features"] .anno-icon-row {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 10px;
      }

      [data-composition-id="scene3-features"] .anno-icon-box {
        width: 44px;
        height: 44px;
        background: #007AFF;
        color: white;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
        font-family: "JetBrains Mono", monospace;
        flex-shrink: 0;
      }

      [data-composition-id="scene3-features"] .anno-inline-title {
        font-size: 34px;
        font-weight: 700;
        color: #1D1D1F;
        letter-spacing: -0.02em;
      }

      [data-composition-id="scene3-features"] .connector-svg {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 11;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const sel = (s) => `[data-composition-id="scene3-features"] ${s}`;

        // Initial states
        gsap.set(sel(".phone-wrapper"), { scale: 0.85, opacity: 0, y: 40 });
        gsap.set(sel(".anno-pareto"), { x: 60, opacity: 0 });
        gsap.set(sel(".anno-tap-detail"), { x: 60, opacity: 0 });
        gsap.set(sel(".anno-manual"), { x: 60, opacity: 0 });
        gsap.set(sel(".anno-price"), { x: 60, opacity: 0 });
        gsap.set(sel(".anno-filter"), { x: 60, opacity: 0 });
        gsap.set(sel(".anno-recompute"), { x: 60, opacity: 0 });
        gsap.set(sel(".tap-indicator"), { opacity: 0, scale: 0.5 });
        gsap.set(sel(".pulse-ring"), { opacity: 0, scale: 0.5 });

        // === Phase 1: Pareto chart display (0-3.5s) ===
        tl.to(sel(".phone-wrapper"), {
          scale: 1, opacity: 1, y: 0,
          duration: 0.7, ease: "back.out(1.3)",
        }, 0.1);

        tl.to(sel(".anno-pareto"), {
          x: 0, opacity: 1,
          duration: 0.5, ease: "power3.out",
        }, 0.6);

        // Connector line to chart
        tl.to(sel(".conn-pareto"), { opacity: 0.5, duration: 0.3 }, 1.0);

        // Pulse ring on a frontier point in the chart
        tl.set(sel(".pulse-ring"), { x: 620, y: 450 }, 1.5);
        tl.to(sel(".pulse-ring"), { opacity: 0.8, scale: 1, duration: 0.2 }, 1.5);
        tl.to(sel(".pulse-ring"), { scale: 2, opacity: 0, duration: 0.5, ease: "power2.out" }, 1.7);
        tl.to(sel(".pulse-ring"), { opacity: 0.8, scale: 1, duration: 0.2 }, 2.2);
        tl.to(sel(".pulse-ring"), { scale: 2, opacity: 0, duration: 0.5, ease: "power2.out" }, 2.4);

        // Fade out pareto annotation
        tl.to(sel(".anno-pareto"), { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, 3.0);
        tl.to(sel(".conn-pareto"), { opacity: 0, duration: 0.2 }, 3.0);

        // === Phase 2: Tap to detail (3.5-5.5s) ===
        tl.to(sel(".anno-tap-detail"), { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 3.3);

        // Tap indicator on chart point
        tl.set(sel(".tap-indicator"), { x: 620, y: 450 }, 3.8);
        tl.to(sel(".tap-indicator"), { opacity: 1, scale: 1, duration: 0.15 }, 3.8);
        tl.to(sel(".tap-ring"), { scale: 1.8, opacity: 0, duration: 0.35, ease: "power2.out" }, 3.8);
        tl.to(sel(".tap-indicator"), { opacity: 0, duration: 0.15 }, 4.2);

        // Transition to detail page
        tl.to(sel(".ss-pareto"), { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 4.3);
        tl.to(sel(".ss-detail"), { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 4.4);

        // Fade out tap-detail annotation
        tl.to(sel(".anno-tap-detail"), { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, 5.0);

        // === Phase 3: Enter manual modification (5.5-7.5s) ===
        tl.to(sel(".anno-manual"), { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 5.3);

        // Transition to editor main view
        tl.to(sel(".ss-detail"), { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 5.8);
        tl.to(sel(".ss-editor"), { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 5.9);

        // Connector to editor
        tl.to(sel(".conn-editor"), { opacity: 0.5, duration: 0.3 }, 6.2);

        // Tap indicator on price field
        tl.set(sel(".tap-indicator"), { x: 580, y: 500 }, 6.5);
        tl.to(sel(".tap-indicator"), { opacity: 1, scale: 1, duration: 0.15 }, 6.5);
        tl.to(sel(".tap-ring"), { scale: 1.8, opacity: 0, duration: 0.35, ease: "power2.out" }, 6.5);
        tl.to(sel(".tap-indicator"), { opacity: 0, duration: 0.15 }, 6.9);

        // Fade out manual annotation, transition to price annotation
        tl.to(sel(".anno-manual"), { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, 7.0);
        tl.to(sel(".conn-editor"), { opacity: 0, duration: 0.2 }, 7.0);

        // === Phase 4: Price adjustment (7.5-9.5s) ===
        tl.to(sel(".anno-price"), { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 7.3);

        // Tap indicator on price input
        tl.set(sel(".tap-indicator"), { x: 580, y: 520 }, 7.8);
        tl.to(sel(".tap-indicator"), { opacity: 1, scale: 1, duration: 0.15 }, 7.8);
        tl.to(sel(".tap-ring"), { scale: 1.8, opacity: 0, duration: 0.35, ease: "power2.out" }, 7.8);
        tl.to(sel(".tap-indicator"), { opacity: 0, duration: 0.15 }, 8.2);

        // Fade out price annotation
        tl.to(sel(".anno-price"), { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, 8.8);

        // === Phase 5: Filter (9.5-11s) ===
        // Transition to filter screenshot
        tl.to(sel(".ss-editor"), { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 9.0);
        tl.to(sel(".ss-filter"), { opacity: 1, duration: 0.25, ease: "power2.inOut" }, 9.1);

        tl.to(sel(".anno-filter"), { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 9.4);

        // Tap indicator on filter toggle
        tl.set(sel(".tap-indicator"), { x: 600, y: 320 }, 9.9);
        tl.to(sel(".tap-indicator"), { opacity: 1, scale: 1, duration: 0.15 }, 9.9);
        tl.to(sel(".tap-ring"), { scale: 1.8, opacity: 0, duration: 0.35, ease: "power2.out" }, 9.9);
        tl.to(sel(".tap-indicator"), { opacity: 0, duration: 0.15 }, 10.3);

        // Fade out filter annotation
        tl.to(sel(".anno-filter"), { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, 10.4);

        // === Phase 6: Recompute (11-13s) ===
        // Transition to recompute screenshot (scroll to top)
        tl.to(sel(".ss-filter"), { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 10.8);
        tl.to(sel(".ss-recompute"), { opacity: 1, duration: 0.25, ease: "power2.inOut" }, 10.9);

        tl.to(sel(".anno-recompute"), { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 11.2);

        // Tap indicator on recompute button (top of editor)
        tl.set(sel(".tap-indicator"), { x: 580, y: 180 }, 11.7);
        tl.to(sel(".tap-indicator"), { opacity: 1, scale: 1, duration: 0.15 }, 11.7);
        tl.to(sel(".tap-ring"), { scale: 1.8, opacity: 0, duration: 0.35, ease: "power2.out" }, 11.7);
        tl.to(sel(".tap-indicator"), { opacity: 0, duration: 0.15 }, 12.1);

        // Wipe everything for transition to share card
        tl.to([
          sel(".phone-wrapper"),
          sel(".annotation-panel"),
          sel(".tap-indicator"),
          sel(".pulse-ring"),
        ], {
          x: -2200, duration: 0.5, ease: "expo.in", stagger: 0.03,
        }, 12.3);

        tl.to([sel(".bg-glow-left"), sel(".bg-glow-right"), sel(".ghost-text"), sel(".ghost-text-2")], {
          opacity: 0, duration: 0.3, ease: "power2.in",
        }, 12.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene3-features"] = tl;
      })();
    </script>
  </div>
</template>
