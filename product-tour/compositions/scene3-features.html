    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const sel = (s) => `[data-composition-id="scene3-features"] ${s}`;

        // Initial states
        gsap.set(sel(".phone-wrapper"), { scale: 0.85, opacity: 0, y: 40 });
        gsap.set(sel(".anno-pareto"), { x: 60, opacity: 0 });
        gsap.set(sel(".anno-tap-detail"), { x: 60, opacity: 0 });
        gsap.set(sel(".anno-manual"), { x: 60, opacity: 0 });
        gsap.set(sel(".anno-price"), { x: 60, opacity: 0 });
        gsap.set(sel(".anno-filter"), { x: 60, opacity: 0 });
        gsap.set(sel(".anno-recompute"), { x: 60, opacity: 0 });
        gsap.set(sel(".tap-indicator"), { opacity: 0, scale: 0.5 });
        gsap.set(sel(".pulse-ring"), { opacity: 0, scale: 0.5 });

        // === Phase 1: Pareto chart display (0-3.5s) ===
        tl.to(sel(".phone-wrapper"), {
          scale: 1, opacity: 1, y: 0,
          duration: 0.7, ease: "back.out(1.3)",
        }, 0.1);

        tl.to(sel(".anno-pareto"), {
          x: 0, opacity: 1,
          duration: 0.5, ease: "power3.out",
        }, 0.6);

        // Connector line to chart
        tl.to(sel(".conn-pareto"), { opacity: 0.5, duration: 0.3 }, 1.0);

        // Pulse ring on a frontier point in the chart
        tl.set(sel(".pulse-ring"), { x: 620, y: 450 }, 1.5);
        tl.to(sel(".pulse-ring"), { opacity: 0.8, scale: 1, duration: 0.2 }, 1.5);
        tl.to(sel(".pulse-ring"), { scale: 2, opacity: 0, duration: 0.5, ease: "power2.out" }, 1.7);
        tl.to(sel(".pulse-ring"), { opacity: 0.8, scale: 1, duration: 0.2 }, 2.2);
        tl.to(sel(".pulse-ring"), { scale: 2, opacity: 0, duration: 0.5, ease: "power2.out" }, 2.4);

        // Fade out pareto annotation
        tl.to(sel(".anno-pareto"), { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, 3.0);
        tl.to(sel(".conn-pareto"), { opacity: 0, duration: 0.2 }, 3.0);

        // === Phase 2: Tap to detail (3.5-5.5s) ===
        tl.to(sel(".anno-tap-detail"), { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 3.3);

        // Tap indicator on chart point
        tl.to(sel(".tap-chart"), { opacity: 1, scale: 1, duration: 0.15 }, 3.8);
        tl.to(sel(".tap-chart .tap-ring"), { scale: 1.8, opacity: 0, duration: 0.35, ease: "power2.out" }, 3.8);
        tl.to(sel(".tap-chart"), { opacity: 0, duration: 0.15 }, 4.2);

        // Transition to detail page
        tl.to(sel(".ss-pareto"), { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 4.3);
        tl.to(sel(".ss-detail"), { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 4.4);

        // Fade out tap-detail annotation
        tl.to(sel(".anno-tap-detail"), { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, 5.0);

        // === Phase 2.5: Detail page — price mismatch (5.9-8.6s) ===
        tl.to(sel(".ss-detail"), { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 5.9);
        tl.to(sel(".ss-detail2"), { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 6.0);

        // Slight push-in to hold attention on the detail page
        tl.to(sel(".phone-wrapper"), { scale: 1.03, duration: 0.4, ease: "power2.out" }, 6.1);
        tl.to(sel(".phone-wrapper"), { scale: 1, duration: 0.35, ease: "power2.inOut" }, 8.1);

        // === Phase 3: Enter manual modification (8.6-10.4s) ===
        tl.to(sel(".anno-manual"), { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 8.4);

        // Transition to editor main view
        tl.to(sel(".ss-detail2"), { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 8.8);
        tl.to(sel(".ss-editor"), { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 8.9);

        // Connector to editor
        tl.to(sel(".conn-editor"), { opacity: 0.5, duration: 0.3 }, 9.2);

        // Tap indicator on price field (card 1 price input)
        tl.to(sel(".tap-price1"), { opacity: 1, scale: 1, duration: 0.15 }, 9.4);
        tl.to(sel(".tap-price1 .tap-ring"), { scale: 1.8, opacity: 0, duration: 0.35, ease: "power2.out" }, 9.4);
        tl.to(sel(".tap-price1"), { opacity: 0, duration: 0.15 }, 9.8);

        // Fade out manual annotation, transition to price annotation
        tl.to(sel(".anno-manual"), { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, 10.0);
        tl.to(sel(".conn-editor"), { opacity: 0, duration: 0.2 }, 10.0);

        // === Phase 4: Price adjustment (10.4-12s) ===
        tl.to(sel(".anno-price"), { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 10.3);

        // Tap indicator on price input (card 2)
        tl.to(sel(".tap-price2"), { opacity: 1, scale: 1, duration: 0.15 }, 10.8);
        tl.to(sel(".tap-price2 .tap-ring"), { scale: 1.8, opacity: 0, duration: 0.35, ease: "power2.out" }, 10.8);
        tl.to(sel(".tap-price2"), { opacity: 0, duration: 0.15 }, 11.2);

        // Fade out price annotation
        tl.to(sel(".anno-price"), { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, 11.8);

        // === Phase 5: Filter (12-13.6s) ===
        // Transition to filter screenshot
        tl.to(sel(".ss-editor"), { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 12.0);
        tl.to(sel(".ss-filter"), { opacity: 1, duration: 0.25, ease: "power2.inOut" }, 12.1);

        tl.to(sel(".anno-filter"), { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 12.3);

        // Tap indicator on a model filter chip
        tl.to(sel(".tap-filter"), { opacity: 1, scale: 1, duration: 0.15 }, 12.7);
        tl.to(sel(".tap-filter .tap-ring"), { scale: 1.8, opacity: 0, duration: 0.35, ease: "power2.out" }, 12.7);
        tl.to(sel(".tap-filter"), { opacity: 0, duration: 0.15 }, 13.1);

        // Fade out filter annotation
        tl.to(sel(".anno-filter"), { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, 13.2);

        // === Phase 6: Recompute (13.6-16s) ===
        // Transition to recompute screenshot (scroll to top)
        tl.to(sel(".ss-filter"), { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 13.6);
        tl.to(sel(".ss-recompute"), { opacity: 1, duration: 0.25, ease: "power2.inOut" }, 13.7);

        tl.to(sel(".anno-recompute"), { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 13.9);

        // Tap indicator on recompute button (top of editor)
        tl.to(sel(".tap-recompute"), { opacity: 1, scale: 1, duration: 0.15 }, 14.3);
        tl.to(sel(".tap-recompute .tap-ring"), { scale: 1.8, opacity: 0, duration: 0.35, ease: "power2.out" }, 14.3);
        tl.to(sel(".tap-recompute"), { opacity: 0, duration: 0.15 }, 14.7);

        // Wipe everything for transition to share card
        tl.to([
          sel(".phone-wrapper"),
          sel(".annotation-panel"),
          sel(".tap-indicator"),
          sel(".pulse-ring"),
        ], {
          x: -2200, duration: 0.5, ease: "expo.in", stagger: 0.03,
        }, 15.2);

        tl.to([sel(".bg-glow-left"), sel(".bg-glow-right"), sel(".ghost-text"), sel(".ghost-text-2")], {
          opacity: 0, duration: 0.3, ease: "power2.in",
        }, 15.4);

        tl.set("[data-hf-id=\"hf-gkzk\"]", { width: 400, height: 840, immediateRender: true }, 0);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene3-features"] = tl;
      })();
