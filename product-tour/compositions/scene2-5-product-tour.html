<template id="scene2-5-product-tour-template">
  <div
    data-composition-id="scene2-5-product-tour"
    data-width="1920"
    data-height="1080"
    data-duration="7"
  >
    <div class="canvas">
      <!-- Background layer -->
      <div class="bg-base"></div>
      <div class="bg-glow-left" data-layout-allow-overflow></div>
      <div class="bg-glow-right" data-layout-allow-overflow></div>
      <div class="ghost-text" data-layout-ignore>PURCHASE</div>
      <div class="ghost-text-2" data-layout-ignore>DECISION</div>

      <!-- Phone Mockup -->
      <div class="phone-wrapper">
        <div class="phone-mockup">
          <div class="phone-notch"></div>
          <div class="phone-screen">
            <img class="screenshot ss-1" src="assets/step-01-category.png" alt="Category" />
            <img class="screenshot ss-2" src="assets/step-03-holding.png" alt="Holding" />
            <img class="screenshot ss-3" src="assets/step-06-result.png" alt="Result" />
            <img class="screenshot ss-4" src="assets/step-07-detail.png" alt="Detail" />
          </div>
        </div>
        <!-- Phone shadow -->
        <div class="phone-shadow"></div>
      </div>

      <!-- Tap indicator -->
      <div class="tap-indicator" data-layout-allow-overflow>
        <div class="tap-ring"></div>
        <div class="tap-dot"></div>
      </div>

      <!-- Feature callouts (right side) -->
      <div class="callout-panel">
        <div class="callout-item callout-1">
          <div class="callout-number">01</div>
          <div class="callout-title">5步决策引导</div>
          <div class="callout-desc">品类 → 预算 → 持有期 → 购买时机 → 性能</div>
        </div>
        <div class="callout-item callout-2">
          <div class="callout-number">02</div>
          <div class="callout-title">帕累托前沿分析</div>
          <div class="callout-desc">多维度对比，非劣解自动筛选</div>
        </div>
        <div class="callout-item callout-3">
          <div class="callout-number">03</div>
          <div class="callout-title">方案详情与修改</div>
          <div class="callout-desc">数据透明，手动调整更灵活</div>
        </div>
      </div>

      <!-- Highlight badges (appear during result page) -->
      <div class="badge-container">
        <div class="badge badge-1">
          <div class="badge-icon">¥</div>
          <div class="badge-label">月均成本</div>
        </div>
        <div class="badge badge-2">
          <div class="badge-icon">%</div>
          <div class="badge-label">性能满足度</div>
        </div>
        <div class="badge badge-3">
          <div class="badge-icon">★</div>
          <div class="badge-label">前沿方案</div>
        </div>
      </div>

      <!-- Connector lines from badges to phone -->
      <svg class="connector-lines" viewBox="0 0 1920 1080" width="1920" height="1080">
        <line class="conn-line conn-1" x1="970" y1="300" x2="1100" y2="300" stroke="#007AFF" stroke-width="2" stroke-dasharray="4 4" opacity="0" />
        <line class="conn-line conn-2" x1="970" y1="500" x2="1100" y2="500" stroke="#007AFF" stroke-width="2" stroke-dasharray="4 4" opacity="0" />
        <line class="conn-line conn-3" x1="970" y1="700" x2="1100" y2="700" stroke="#007AFF" stroke-width="2" stroke-dasharray="4 4" opacity="0" />
      </svg>
    </div>

    <style>
      @font-face { font-family: 'Noto Sans SC'; src: local('Noto Sans SC'), local('Noto Sans CJK SC'); }
      @font-face { font-family: 'Microsoft YaHei'; src: local('Microsoft YaHei'); }
      [data-composition-id="scene2-5-product-tour"] .canvas {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        font-family: "Inter", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      [data-composition-id="scene2-5-product-tour"] .bg-base {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #F5F5F7;
      }

      [data-composition-id="scene2-5-product-tour"] .bg-glow-left {
        position: absolute;
        top: 200px; left: -200px;
        width: 800px; height: 800px;
        background: radial-gradient(circle, rgba(0, 122, 255, 0.06) 0%, rgba(245, 245, 247, 0) 70%);
        border-radius: 50%;
      }

      [data-composition-id="scene2-5-product-tour"] .bg-glow-right {
        position: absolute;
        top: 100px; right: -100px;
        width: 600px; height: 600px;
        background: radial-gradient(circle, rgba(0, 122, 255, 0.04) 0%, rgba(245, 245, 247, 0) 70%);
        border-radius: 50%;
      }

      [data-composition-id="scene2-5-product-tour"] .ghost-text {
        position: absolute;
        top: 60px; left: -40px;
        font-size: 200px;
        font-weight: 800;
        color: rgba(0, 122, 255, 0.035);
        letter-spacing: -0.04em;
        pointer-events: none;
        white-space: nowrap;
      }

      [data-composition-id="scene2-5-product-tour"] .ghost-text-2 {
        position: absolute;
        bottom: 40px; right: -20px;
        font-size: 200px;
        font-weight: 800;
        color: rgba(0, 122, 255, 0.03);
        letter-spacing: -0.04em;
        pointer-events: none;
        white-space: nowrap;
      }

      [data-composition-id="scene2-5-product-tour"] .phone-wrapper {
        position: absolute;
        left: 560px;
        top: 70px;
        width: 400px;
        height: 940px;
        transform-origin: center center;
      }

      [data-composition-id="scene2-5-product-tour"] .phone-mockup {
        position: relative;
        width: 100%;
        height: 100%;
        background: #1D1D1F;
        border-radius: 52px;
        padding: 10px;
        box-shadow: 0 40px 80px rgba(29, 29, 31, 0.12),
                    0 15px 35px rgba(29, 29, 31, 0.08),
                    inset 0 0 0 2px rgba(255,255,255,0.06);
        z-index: 5;
      }

      [data-composition-id="scene2-5-product-tour"] .phone-notch {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 28px;
        background: #1D1D1F;
        border-radius: 0 0 18px 18px;
        z-index: 10;
      }

      [data-composition-id="scene2-5-product-tour"] .phone-screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 44px;
        overflow: hidden;
        background: #FFFFFF;
      }

      [data-composition-id="scene2-5-product-tour"] .screenshot {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
      }

      [data-composition-id="scene2-5-product-tour"] .ss-1 { opacity: 1; }

      [data-composition-id="scene2-5-product-tour"] .phone-shadow {
        position: absolute;
        bottom: -30px;
        left: 50%;
        transform: translateX(-50%);
        width: 340px;
        height: 30px;
        background: radial-gradient(ellipse, rgba(29,29,31,0.15) 0%, rgba(245,245,247,0) 70%);
        border-radius: 50%;
      }

      [data-composition-id="scene2-5-product-tour"] .tap-indicator {
        position: absolute;
        z-index: 20;
        pointer-events: none;
        opacity: 0;
      }

      [data-composition-id="scene2-5-product-tour"] .tap-ring {
        position: absolute;
        width: 40px;
        height: 40px;
        border: 3px solid #007AFF;
        border-radius: 50%;
        top: -20px;
        left: -20px;
      }

      [data-composition-id="scene2-5-product-tour"] .tap-dot {
        position: absolute;
        width: 12px;
        height: 12px;
        background: #007AFF;
        border-radius: 50%;
        top: -6px;
        left: -6px;
      }

      [data-composition-id="scene2-5-product-tour"] .callout-panel {
        position: absolute;
        right: 100px;
        top: 180px;
        width: 420px;
        display: flex;
        flex-direction: column;
        gap: 32px;
        z-index: 15;
      }

      [data-composition-id="scene2-5-product-tour"] .callout-item {
        opacity: 0;
      }

      [data-composition-id="scene2-5-product-tour"] .callout-number {
        font-family: "JetBrains Mono", "Inter", monospace;
        font-size: 16px;
        font-weight: 600;
        color: #007AFF;
        margin-bottom: 6px;
        letter-spacing: 0.05em;
      }

      [data-composition-id="scene2-5-product-tour"] .callout-title {
        font-size: 36px;
        font-weight: 700;
        color: #1D1D1F;
        margin-bottom: 8px;
        letter-spacing: -0.02em;
      }

      [data-composition-id="scene2-5-product-tour"] .callout-desc {
        font-size: 20px;
        font-weight: 400;
        color: #86868B;
        line-height: 1.4;
      }

      [data-composition-id="scene2-5-product-tour"] .badge-container {
        position: absolute;
        left: 1000px;
        top: 0;
        width: 0;
        height: 0;
        z-index: 12;
      }

      [data-composition-id="scene2-5-product-tour"] .badge {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 12px;
        background: #FFFFFF;
        padding: 14px 24px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(29, 29, 31, 0.1), 0 2px 8px rgba(29, 29, 31, 0.06);
        opacity: 0;
        white-space: nowrap;
      }

      [data-composition-id="scene2-5-product-tour"] .badge-1 { top: 280px; left: 30px; }
      [data-composition-id="scene2-5-product-tour"] .badge-2 { top: 480px; left: 30px; }
      [data-composition-id="scene2-5-product-tour"] .badge-3 { top: 680px; left: 30px; }

      [data-composition-id="scene2-5-product-tour"] .badge-icon {
        width: 36px;
        height: 36px;
        background: #007AFF;
        color: white;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 700;
        font-family: "JetBrains Mono", monospace;
      }

      [data-composition-id="scene2-5-product-tour"] .badge-label {
        font-size: 20px;
        font-weight: 600;
        color: #1D1D1F;
      }

      [data-composition-id="scene2-5-product-tour"] .connector-lines {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 11;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const sel = (s) => `[data-composition-id="scene2-5-product-tour"] ${s}`;

        // Initial states
        gsap.set(sel(".phone-wrapper"), { scale: 0.85, opacity: 0, y: 40 });
        gsap.set(sel(".callout-1"), { x: 60, opacity: 0 });
        gsap.set(sel(".callout-2"), { x: 60, opacity: 0 });
        gsap.set(sel(".callout-3"), { x: 60, opacity: 0 });
        gsap.set(sel(".tap-indicator"), { opacity: 0, scale: 0.5 });

        // === Phase 1: Phone appears with first screenshot (0-1.5s) ===
        tl.to(sel(".phone-wrapper"), {
          scale: 1, opacity: 1, y: 0,
          duration: 0.6, ease: "back.out(1.3)",
        }, 0.1);

        tl.to(sel(".callout-1"), {
          x: 0, opacity: 1,
          duration: 0.4, ease: "power3.out",
        }, 0.5);

        // Tap indicator on category selection
        tl.set(sel(".tap-indicator"), { x: 730, y: 480 }, 1.0);
        tl.to(sel(".tap-indicator"), { opacity: 1, scale: 1, duration: 0.15 }, 1.0);
        tl.to(sel(".tap-ring"), { scale: 1.8, opacity: 0, duration: 0.3, ease: "power2.out" }, 1.0);
        tl.to(sel(".tap-indicator"), { opacity: 0, duration: 0.15 }, 1.4);

        // === Phase 2: Transition to holding period screenshot (1.5-3s) ===
        tl.to(sel(".ss-1"), { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 1.6);
        tl.to(sel(".ss-2"), { opacity: 1, duration: 0.25, ease: "power2.inOut" }, 1.7);

        tl.set(sel(".tap-indicator"), { x: 700, y: 550 }, 2.2);
        tl.to(sel(".tap-indicator"), { opacity: 1, scale: 1, duration: 0.15 }, 2.2);
        tl.to(sel(".tap-ring"), { scale: 1.8, opacity: 0, duration: 0.3, ease: "power2.out" }, 2.2);
        tl.to(sel(".tap-indicator"), { opacity: 0, duration: 0.15 }, 2.6);

        // === Phase 3: Transition to result page (3-4.5s) ===
        tl.to(sel(".ss-2"), { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 2.9);
        tl.to(sel(".ss-3"), { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 3.0);

        tl.to(sel(".phone-wrapper"), { scale: 1.04, duration: 0.4, ease: "power2.out" }, 3.1);

        tl.to(sel(".callout-2"), { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 3.4);

        // Badges appear with stagger
        tl.to(sel(".badge-1"), { x: 0, opacity: 1, duration: 0.3, ease: "back.out(1.5)" }, 3.6);
        tl.to(sel(".conn-1"), { opacity: 0.6, duration: 0.2 }, 3.8);
        tl.to(sel(".badge-2"), { x: 0, opacity: 1, duration: 0.3, ease: "back.out(1.5)" }, 3.9);
        tl.to(sel(".conn-2"), { opacity: 0.6, duration: 0.2 }, 4.1);
        tl.to(sel(".badge-3"), { x: 0, opacity: 1, duration: 0.3, ease: "back.out(1.5)" }, 4.2);
        tl.to(sel(".conn-3"), { opacity: 0.6, duration: 0.2 }, 4.4);

        // Badges hold briefly, then fade
        tl.to([sel(".badge-1"), sel(".badge-2"), sel(".badge-3")], {
          opacity: 0, y: -20, duration: 0.25, ease: "power2.in", stagger: 0.04,
        }, 5.0);
        tl.to([sel(".conn-1"), sel(".conn-2"), sel(".conn-3")], { opacity: 0, duration: 0.2 }, 5.0);

        tl.to(sel(".phone-wrapper"), { scale: 1, duration: 0.3, ease: "power2.inOut" }, 5.2);

        // === Phase 4: Transition to detail page (5-6.5s) ===
        tl.to(sel(".ss-3"), { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 5.4);
        tl.to(sel(".ss-4"), { opacity: 1, duration: 0.25, ease: "power2.inOut" }, 5.5);

        tl.to(sel(".callout-3"), { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 5.8);

        // === Phase 5: Wipe everything for transition (6.5-7s) ===
        tl.to([
          sel(".phone-wrapper"),
          sel(".callout-panel"),
          sel(".badge-container"),
          sel(".tap-indicator"),
        ], {
          x: -2200, duration: 0.4, ease: "expo.in", stagger: 0.03,
        }, 6.4);

        tl.to(sel(".bg-base"), { backgroundColor: "#F5F5F7", duration: 0.3 }, 6.6);
        tl.to([sel(".bg-glow-left"), sel(".bg-glow-right"), sel(".ghost-text"), sel(".ghost-text-2")], {
          opacity: 0, duration: 0.3, ease: "power2.in",
        }, 6.6);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene2-5-product-tour"] = tl;
      })();
    </script>
  </div>
</template>
