<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logo SVG — iOS 风格色块拼接（squircle 版）
  ──────────────────────────────────────────────
  坐标系: viewBox -8 -8 116 116（内容 0~100，四周 8px 留白给投影）
  基于用户手动调整后的 SVG，y 坐标归一化（原 y-4 → y）

  结构 ID（用于动画拆分）:
    #squircle              白色圆角方块背景（含投影）
    #logo-content          所有内容（裁剪到 squircle）
      #curve              蓝色弧形
        #curve-fill        三次贝塞尔渐变填充
        #curve-highlight   8px 高光描边（沿曲线+边缘）
      #dots               白色圆点组（12 个，各有透明度）
        #dot-01 ~ #dot-12 独立圆点

  使用:
    • 网页 HTML:  <img src="logo.svg"> 或内联
    • App 图标:  用 logo-flat.svg
    • 动画:       内联后用 CSS 按 ID 定位各部件
-->
<svg viewBox="-8 -8 116 116" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Logo</title>
  <desc id="logo-desc">iOS 风格图标：白色 squircle 上，蓝色渐变弧形色块与散落白色圆点。</desc>

  <defs>
    <!-- 蓝色渐变：天蓝 → 品牌蓝 -->
    <linearGradient id="grad-blue" x1="15" y1="5" x2="85" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="50%" stop-color="#2B8CF7"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>

    <!-- 高光渐变：沿曲线从左下到右上渐隐 -->
    <linearGradient id="grad-hl" x1="4.96" y1="100" x2="103.93" y2="4.04" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.87"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.47"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Squircle 裁剪 -->
    <clipPath id="clip-sq">
      <rect x="0" y="0" width="100" height="100" rx="22" ry="22"/>
    </clipPath>

    <!-- 投影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1D1D1F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ════ 部件 1: Squircle 背景 ════ -->
  <g id="squircle">
    <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="#FFFFFF" filter="url(#shadow)"/>
  </g>

  <!-- ════ 部件 2: 内容（裁剪到 squircle） ════ -->
  <g id="logo-content" clip-path="url(#clip-sq)">

    <!-- 蓝色弧形：三次贝塞尔曲线，左上角切出弧形 -->
    <g id="curve">
      <path id="curve-fill"
            d="M70,0 H100 V100 H0 V70 C0,51.4348 7.37498,33.6301 20.5025,20.5025 C33.6301,7.375 51.4348,0 70,0 Z"
            fill="url(#grad-blue)"/>
      <path id="curve-highlight"
            d="M100,0 H71.2 C53.3775,0 36.2849,7.375 23.6824,20.5025 C11.08,33.6301 4,51.4348 4,70 V100"
            fill="none" stroke="url(#grad-hl)" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- 白色圆点（12 个，各有不同透明度） -->
    <g id="dots" fill="#FFFFFF">
      <circle id="dot-01" cx="87"   cy="20"   r="3"/>
      <circle id="dot-02" cx="29"   cy="31"   r="3"/>
      <circle id="dot-03" cx="26.5" cy="43.5" r="5.5"/>
      <circle id="dot-04" cx="84"   cy="45"   r="4"   opacity="0.8"/>
      <circle id="dot-05" cx="69.5" cy="29.5" r="6.5" opacity="0.85"/>
      <circle id="dot-06" cx="39.5" cy="61.5" r="4.5" opacity="0.9"/>
      <circle id="dot-07" cx="60"   cy="54"   r="5"   opacity="0.85"/>
      <circle id="dot-08" cx="49"   cy="33"   r="5"   opacity="0.9"/>
      <circle id="dot-09" cx="44"   cy="80"   r="4"   opacity="0.6"/>
      <circle id="dot-10" cx="20.5" cy="66.5" r="3.5"/>
      <circle id="dot-11" cx="81"   cy="60"   r="3"   opacity="0.6"/>
      <circle id="dot-12" cx="51"   cy="16"   r="5"/>
    </g>

  </g>
</svg>
