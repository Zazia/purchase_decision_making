<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigation – Apple Report</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-family-base); color: var(--color-foreground); }
  .specimen { display: flex; flex-direction: column; gap: var(--space-2); }
  .stage { display: flex; flex-direction: column; gap: var(--space-2); }
  .story { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: var(--space-3); }
  .rail { display: flex; align-items: center; width: 100%; }
  .story-label { font-size: var(--font-size-caption); color: var(--muted); text-transform: uppercase; white-space: nowrap; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: 0; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .top-nav { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 56px; padding: 0 var(--space-4); background: var(--color-background); border-bottom: 1px solid var(--color-border); }
  .top-nav .brand { font-family: var(--font-display); font-size: var(--font-size-h4); font-weight: var(--font-weight-h4); color: var(--color-foreground); white-space: nowrap; flex-shrink: 0; }
  .top-nav .links { display: flex; align-items: center; gap: var(--space-1); flex: 1; justify-content: center; }
  .top-nav .actions { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
  .side-nav { display: flex; flex-direction: column; gap: var(--space-2); width: 240px; padding: var(--space-3); background: var(--color-surface); border-right: 1px solid var(--color-border); }
  .side-nav .brand { font-family: var(--font-display); font-size: var(--font-size-h4); font-weight: var(--font-weight-h4); color: var(--color-foreground); margin-bottom: var(--space-2); white-space: nowrap; flex-shrink: 0; }
  .side-nav .stack { display: flex; flex-direction: column; gap: var(--space-1); }
  .nav-item { display: inline-flex; align-items: center; height: var(--size-button-sm); min-width: var(--size-button-sm); padding: 0 var(--space-3); color: var(--color-foreground); font-size: var(--font-size-body); text-decoration: none; white-space: nowrap; flex-shrink: 0; transition: background .15s, filter .15s; }
  .nav-item:hover { background: var(--color-border); }
  .nav-item.active { background: var(--color-border); color: var(--color-primary); }
  .nav-item.disabled { color: var(--muted); pointer-events: none; }
  /* @component-css-end */
</style>
</head>
<body>
<div class="specimen">
  <div class="stage">
    <div class="story">
      <span class="story-label">顶部导航</span>
      <div class="rail">
        <nav class="top-nav" aria-label="主导航">
          <div class="brand">Apple Report</div>
          <div class="links">
            <a class="nav-item active" href="#" aria-current="page">总览</a>
            <a class="nav-item" href="#">报表</a>
            <a class="nav-item" href="#">分析</a>
            <a class="nav-item disabled" href="#" aria-disabled="true">设置</a>
          </div>
          <div class="actions">
            <a class="nav-item" href="#">帮助</a>
          </div>
        </nav>
      </div>
    </div>
    <hr class="divider">
    <div class="story">
      <span class="story-label">侧边导航</span>
      <div class="rail">
        <nav class="side-nav" aria-label="侧边导航">
          <div class="brand">Apple Report</div>
          <div class="stack">
            <a class="nav-item active" href="#" aria-current="page">总览</a>
            <a class="nav-item" href="#">报表</a>
            <a class="nav-item" href="#">分析</a>
            <a class="nav-item disabled" href="#" aria-disabled="true">设置</a>
          </div>
        </nav>
      </div>
    </div>
  </div>
</div>
</body>
</html>
