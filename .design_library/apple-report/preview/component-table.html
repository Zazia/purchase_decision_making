<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table · Apple Report</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    /* Page scaffold — NOT extracted */
    body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-family-base); color: var(--color-foreground); font-size: var(--font-size-body); line-height: var(--line-height-body); }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .label { width: 92px; flex-shrink: 0; color: var(--muted); font-size: var(--font-size-caption); line-height: var(--line-height-caption); font-weight: 600; text-transform: uppercase; }
    .divider { border: none; border-top: 1px solid var(--color-border); margin: 12px 0; }

    /* @component-css-start */
    /* Component definitions — extracted to components.css by deterministic script */
    .report-table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
    .report-table th, .report-table td { padding: var(--space-3) var(--space-4); text-align: left; border-bottom: 1px solid var(--color-border); font-weight: var(--font-weight-body); }
    .report-table thead th { color: var(--muted); font-size: var(--font-size-caption); line-height: var(--line-height-caption); font-weight: var(--font-weight-h4); white-space: nowrap; }
    .report-table tbody tr:last-child td { border-bottom: none; }
    .report-table tbody tr:hover { filter: brightness(0.97); transition: filter .15s; }
    .report-table tbody tr.is-disabled { color: var(--muted); }
    .report-table--compact th, .report-table--compact td { padding: var(--space-2) var(--space-3); font-size: var(--font-size-caption); line-height: var(--line-height-caption); }
    /* @component-css-end */
  </style>
</head>
<body>
  <div class="row"><span class="label">默认表格</span></div>
  <div class="row">
    <table class="report-table">
      <thead>
        <tr><th>日期</th><th>渠道</th><th>用户数</th><th>收入</th><th>状态</th></tr>
      </thead>
      <tbody>
        <tr><td>2024-07-20</td><td>App Store</td><td>12,480</td><td>¥89,400</td><td>活跃</td></tr>
        <tr><td>2024-07-19</td><td>官方网站</td><td>8,320</td><td>¥52,100</td><td>活跃</td></tr>
        <tr><td>2024-07-18</td><td>社交媒体</td><td>6,150</td><td>¥34,800</td><td>待确认</td></tr>
        <tr class="is-disabled"><td>2024-07-17</td><td>第三方平台</td><td>1,020</td><td>¥5,600</td><td>已停用</td></tr>
      </tbody>
    </table>
  </div>

  <hr class="divider">

  <div class="row"><span class="label">紧凑视图</span></div>
  <div class="row">
    <table class="report-table report-table--compact">
      <thead>
        <tr><th>日期</th><th>渠道</th><th>用户数</th><th>收入</th><th>状态</th></tr>
      </thead>
      <tbody>
        <tr><td>2024-07-20</td><td>App Store</td><td>12,480</td><td>¥89,400</td><td>活跃</td></tr>
        <tr><td>2024-07-19</td><td>官方网站</td><td>8,320</td><td>¥52,100</td><td>活跃</td></tr>
        <tr><td>2024-07-18</td><td>社交媒体</td><td>6,150</td><td>¥34,800</td><td>待确认</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
