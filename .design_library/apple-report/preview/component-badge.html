<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Badge Preview</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-body); color: var(--color-foreground); }
    .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
    .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
    /* @component-css-start */
    /* Component definitions — extracted to components.css by deterministic script */
    .badge { display: inline-flex; align-items: center; flex-shrink: 0; height: 24px; min-width: 24px; padding: 0 var(--space-2); border-radius: var(--radius-full); font-size: var(--font-size-caption); font-weight: var(--font-weight-caption); line-height: 1; white-space: nowrap; }
    .badge-default { background: var(--report-gray-100); color: var(--report-gray-600); }
    .badge-success { background: var(--report-green-100); color: var(--color-success); }
    .badge-warning { background: var(--report-amber-100); color: var(--color-warning); }
    .badge-error { background: var(--report-red-100); color: var(--color-error); }
    /* @component-css-end */
  </style>
</head>
<body>
  <div class="row">
    <span class="label">状态标签</span>
    <span class="badge badge-default" data-evidence-sample="default">进行中</span>
    <span class="badge badge-success" data-evidence-sample="success">已完成</span>
    <span class="badge badge-warning">需注意</span>
    <span class="badge badge-error">已取消</span>
  </div>
</body>
</html>
