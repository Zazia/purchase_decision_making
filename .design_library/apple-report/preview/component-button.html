<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button - Apple Report</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-family-base); color: var(--color-foreground); }
  .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--muted); line-height: 1.5; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }

  /* @component-css-start */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); border: none; cursor: pointer; font-family: var(--font-family-base); font-size: var(--font-size-body); font-weight: 500; line-height: 1; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; transition: background .15s, border-color .15s; flex-shrink: 0; }
  .btn:disabled { cursor: not-allowed; opacity: 0.5; }
  .btn-sm { height: var(--size-button-sm); min-width: var(--size-button-sm); padding: 0 var(--space-2); border-radius: var(--radius-md); }
  .btn-md { height: var(--size-button-md); min-width: var(--size-button-md); padding: 0 var(--space-3); border-radius: var(--radius-md); }
  .btn-lg { height: var(--size-button-lg); min-width: var(--size-button-lg); padding: 0 var(--space-4); border-radius: var(--radius-md); }
  .btn-primary { background: var(--color-primary); color: var(--color-surface); }
  .btn-primary:hover:not(:disabled) { background: var(--color-primary-hover); }
  .btn-soft { background: var(--color-background); color: var(--color-foreground); }
  .btn-soft:hover:not(:disabled) { background: var(--color-border); }
  .btn-ghost { background: transparent; color: var(--color-primary); }
  .btn-ghost:hover:not(:disabled) { background: var(--color-background); }
  .btn-outline { background: transparent; color: var(--color-primary); border: 1px solid var(--color-border); }
  .btn-outline:hover:not(:disabled) { background: var(--color-background); border-color: var(--color-primary); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row"><span class="label">主要操作</span><button class="btn btn-md btn-primary">保存</button></div>
  <div class="row"><span class="label">次要操作</span><button class="btn btn-md btn-soft">取消</button></div>
  <div class="row"><span class="label">低优先级</span><button class="btn btn-md btn-ghost">编辑</button></div>
  <div class="row"><span class="label">轮廓样式</span><button class="btn btn-md btn-outline">查看详情</button></div>
  <hr class="divider">
  <div class="row"><span class="label">尺寸对比</span><button class="btn btn-sm btn-primary">小</button><button class="btn btn-md btn-primary">中</button><button class="btn btn-lg btn-primary">大</button></div>
  <div class="row"><span class="label">禁用状态</span><button class="btn btn-md btn-primary" disabled>保存</button><button class="btn btn-md btn-soft" disabled>取消</button></div>
</body>
</html>
