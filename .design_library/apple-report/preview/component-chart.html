<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart · Apple Report</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-family-base); color: var(--color-foreground); }
  .specimen { display: flex; flex-direction: column; gap: var(--space-4); }
  .story { display: flex; gap: var(--space-3); align-items: flex-start; }
  .story-label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--muted); text-transform: uppercase; line-height: 1.3; padding-top: 2px; }
  .stage { flex: 1; min-width: 0; }
  hr.divider { border: none; border-top: 1px solid var(--color-border); margin: 0; }

  /* @component-css-start */
  .chart { width: 100%; }
  .chart-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-2); }
  .chart-title { font-family: var(--font-display); font-size: var(--font-size-body); font-weight: var(--font-weight-h4); color: var(--color-foreground); margin: 0; }
  .chart-legend { display: flex; gap: var(--space-3); font-size: var(--font-size-caption); color: var(--muted); }
  .legend-item { display: inline-flex; align-items: center; gap: var(--space-1); }
  .legend-dot { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--color-primary); flex-shrink: 0; }
  .chart-svg { width: 100%; height: 160px; display: block; }
  .chart-bar { fill: var(--color-primary); rx: var(--radius-sm); }
  .chart-line { fill: none; stroke: var(--color-primary); stroke-width: 2; }
  .chart-area { fill: var(--color-primary); fill-opacity: 0.12; }
  .chart-grid { stroke: var(--color-border); stroke-width: 1; }
  .chart-axis { stroke: var(--color-border); stroke-width: 1; }
  .chart-axis-text { fill: var(--muted); font-size: var(--font-size-caption); font-family: var(--font-family-base); }
  /* @component-css-end */
</style>
</head>
<body>
<div class="specimen">
  <div class="story">
    <span class="story-label">柱状图</span>
    <div class="stage">
      <div class="chart" data-evidence-sample="bar-chart">
        <div class="chart-header">
          <h3 class="chart-title">季度销售额</h3>
          <div class="chart-legend"><span class="legend-item"><span class="legend-dot"></span>实际</span></div>
        </div>
        <svg class="chart-svg" viewBox="0 0 400 160" preserveAspectRatio="none" role="img" aria-label="季度销售额柱状图">
          <g class="chart-grid">
            <line x1="40" y1="20" x2="380" y2="20"/>
            <line x1="40" y1="60" x2="380" y2="60"/>
            <line x1="40" y1="100" x2="380" y2="100"/>
          </g>
          <rect class="chart-bar" x="60" y="80" width="40" height="60"/>
          <rect class="chart-bar" x="120" y="50" width="40" height="90"/>
          <rect class="chart-bar" x="180" y="30" width="40" height="110"/>
          <rect class="chart-bar" x="240" y="70" width="40" height="70"/>
          <rect class="chart-bar" x="300" y="90" width="40" height="50"/>
          <g class="chart-axis">
            <line x1="40" y1="140" x2="380" y2="140"/>
          </g>
          <text class="chart-axis-text" x="80" y="155" text-anchor="middle">Q1</text>
          <text class="chart-axis-text" x="140" y="155" text-anchor="middle">Q2</text>
          <text class="chart-axis-text" x="200" y="155" text-anchor="middle">Q3</text>
          <text class="chart-axis-text" x="260" y="155" text-anchor="middle">Q4</text>
          <text class="chart-axis-text" x="320" y="155" text-anchor="middle">Q1</text>
        </svg>
      </div>
    </div>
  </div>
  <hr class="divider">
  <div class="story">
    <span class="story-label">折线图</span>
    <div class="stage">
      <div class="chart" data-evidence-sample="line-chart">
        <div class="chart-header">
          <h3 class="chart-title">用户增长趋势</h3>
          <div class="chart-legend"><span class="legend-item"><span class="legend-dot"></span>新增用户</span></div>
        </div>
        <svg class="chart-svg" viewBox="0 0 400 160" preserveAspectRatio="none" role="img" aria-label="用户增长趋势折线图">
          <g class="chart-grid">
            <line x1="40" y1="20" x2="380" y2="20"/>
            <line x1="40" y1="60" x2="380" y2="60"/>
            <line x1="40" y1="100" x2="380" y2="100"/>
          </g>
          <polygon class="chart-area" points="40,140 100,110 160,80 220,90 280,50 340,60 380,40 380,140 40,140"/>
          <polyline class="chart-line" points="40,140 100,110 160,80 220,90 280,50 340,60 380,40"/>
          <g class="chart-axis">
            <line x1="40" y1="140" x2="380" y2="140"/>
          </g>
          <text class="chart-axis-text" x="40" y="155" text-anchor="middle">1月</text>
          <text class="chart-axis-text" x="120" y="155" text-anchor="middle">3月</text>
          <text class="chart-axis-text" x="200" y="155" text-anchor="middle">5月</text>
          <text class="chart-axis-text" x="280" y="155" text-anchor="middle">7月</text>
          <text class="chart-axis-text" x="360" y="155" text-anchor="middle">9月</text>
        </svg>
      </div>
    </div>
  </div>
</div>
</body>
</html>
