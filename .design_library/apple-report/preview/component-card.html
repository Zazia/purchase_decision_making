<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-family-base); color: var(--color-foreground); }
  .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); }
  .label { min-width: 92px; padding-top: var(--space-1); font-size: var(--font-size-caption); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; flex-shrink: 0; }
  .divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .card { width: 100%; background: var(--color-surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-1); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); transition: filter .15s; }
  .card:hover { filter: brightness(0.97); }
  .card-header { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); }
  .card-title { font-family: var(--font-display); font-size: var(--font-size-h4); font-weight: var(--font-weight-h4); line-height: var(--line-height-h4); color: var(--color-foreground); margin: 0; }
  .card-caption { font-size: var(--font-size-caption); color: var(--muted); white-space: nowrap; }
  .card-body { display: flex; align-items: baseline; gap: var(--space-2); }
  .card-metric { font-family: var(--font-display); font-size: var(--font-size-h2); font-weight: var(--font-weight-h2); line-height: var(--line-height-h2); color: var(--color-foreground); margin: 0; }
  .card-change { font-size: var(--font-size-body); font-weight: 600; color: var(--color-success); }
  .card-footer { font-size: var(--font-size-caption); color: var(--accent); }
  .card-raised { box-shadow: var(--shadow-2); }
  .card-desc { font-size: var(--font-size-body); line-height: var(--line-height-body); color: var(--color-foreground); margin: 0; }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">Default</span>
    <article class="card" data-evidence-sample="default">
      <div class="card-header">
        <h4 class="card-title">活跃用户</h4>
        <span class="card-caption">本月</span>
      </div>
      <div class="card-body">
        <p class="card-metric">12,480</p>
        <span class="card-change">+12.8%</span>
      </div>
      <div class="card-footer">查看详情</div>
    </article>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">Raised</span>
    <article class="card card-raised" data-evidence-sample="raised">
      <div class="card-header">
        <h4 class="card-title">核心洞察</h4>
      </div>
      <p class="card-desc">移动端转化率在周末达到峰值，建议在周五至周日加大推送投放。</p>
    </article>
  </div>
</body>
</html>
